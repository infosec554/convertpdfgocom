name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: infosec554
          password: dckr_pat_UUKDAiNMHloJh-EhqaZ2ELo1sp4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: infosec554/convertpdfgo:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Login to Docker Hub on server (optional if public repo, but good practice)
            echo "dckr_pat_UUKDAiNMHloJh-EhqaZ2ELo1sp4" | docker login -u "infosec554" --password-stdin
            
            # Stop existing container if running
            docker stop app || true
            docker rm app || true
            
            # Pull new image
            docker pull infosec554/convertpdfgo:latest
            
            # Run new container
            # Adjust environment variables and ports as needed
            docker run -d \
              --name app \
              --restart unless-stopped \
              --network host \
              -e BOT_TOKEN="${{ secrets.BOT_TOKEN }}" \
              -e ADMIN_ID="${{ secrets.ADMIN_ID }}" \
              -e POSTGRES_CONN="${{ secrets.POSTGRES_CONN }}" \
               infosec554/convertpdfgo:latest
